<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Logic Hub</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <div class="container">
        <h1>Math Logic Explorer</h1>
        <p>Enter a number and choose an operation:</p>
        
        <input type="number" id="userInput" placeholder="Enter your number here...">

        <div class="button-grid">
            <button onclick="checkEven()">Check Even</button>
            <button onclick="checkOdd()">Check Odd</button>
            <button onclick="checkPrime()">Prime Check</button>
            <button onclick="calculateFactorial()">Factorial</button>
            <button onclick="checkArmstrong()">Armstrong</button>
        </div>

        <div id="resultDisplay" class="output-box">
            The result will appear here.
        </div>
    </div>

    <script src="q1.js"></script>
</body>
</html>
