<!DOCTYPE html>
<html style="background-color: white; color: black;">
    <head>
        <title>SVG PRACTICE</title>
    </head>
    <body">
        <h1>SVG Rectangle Example</h1>
        <svg width="350" height="300">
            <rect x="50" y="50" width="250" height="200" fill="blue" stroke="yellow" stroke-width="3" />
        </svg>
        
        <h1>SVG Circle Example</h1>
        <svg width="300" height="300">
            <circle cx="150" cy="140" r="100" fill="gren" stroke="white" stroke-width="3" />
        </svg>
        
        <h1>SVG LINE Example</h1>
        <svg width="300" height="300">
            <line x1="10" y1="10" x2="300" y2="200" stroke="green" stroke-width="3" />
        </svg>
        
        <h1>SVG CURVED RECTANGLE Example</h1>
        <svg width="350" height="400">
            <rect x="50" y="30" rx="30" ry="30" width="250" height="250" stroke="white" stroke-width="5" opacity="0.6"/>
        </svg>
        
        <h1>SVG STAR Example</h1>
        <svg width="200" height="300">
            <polygon points="100,10 40,198 190,78 10,78 160,198"
                style="fill: lime; stroke: purple; stroke-width: 5; fill-rule: evenodd;"/>
        </svg>
    </body>
</html>b
