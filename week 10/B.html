<!DOCTYPE html>
<html>
<head>
    <title>Sort Three Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
             background-image: url(https://www.slidekit.com/wp-content/uploads/2024/07/Abstract-Numbers-PowerPoint-Template.jpg);
            text-align: center;
            margin-top: 80px;
        }

        .container {
            background: #be5e5e;
            padding: 25px;
            width: 320px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
        }

        input {
            width: 85%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color:#2980b9;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1c5980;
        }
    </style>

    <script>
        function sortNumbers() {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);
            let c = parseFloat(document.getElementById("num3").value);

            let temp;

            // Sorting using conditional statements (ascending order)
            if (a > b) {
                temp = a;
                a = b;
                b = temp;
            }

            if (a > c) {
                temp = a;
                a = c;
                c = temp;
            }

            if (b > c) {
                temp = b;
                b = c;
                c = temp;
            }

            alert("Sorted numbers in ascending order: " + a + ", " + b + ", " + c);
        }
    </script>
</head>

<body>

    <div class="container">
        <h2 style="font-style:oblique;">***Sorting Numbers***</h2>

        <input type="number" id="num1" placeholder="Enter first number"><br>
        <input type="number" id="num2" placeholder="Enter second number"><br>
        <input type="number" id="num3" placeholder="Enter third number"><br>

        <button onclick="sortNumbers()">Sort Numbers</button>
    </div>

</body>
</html>
