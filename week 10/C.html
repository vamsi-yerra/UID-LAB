<!DOCTYPE html>
<html>
<head>
    <title>Largest of Five Numbers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url(https://wallpapers.com/images/hd/black-and-white-number-1920-x-1080-wallpaper-u44ri8uoxliieo2k.jpg);
            text-align: center;
            margin-top: 60px;
        }

        .container {
            background: #81f5ae;
            padding: 25px;
            width: 340px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
        }

        input {
            width: 85%;
            padding: 8px;
            margin: 6px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #6a5acd;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #483d8b;
        }
    </style>

    <script>
        function findLargest() {
            let n1 = parseFloat(document.getElementById("num1").value);
            let n2 = parseFloat(document.getElementById("num2").value);
            let n3 = parseFloat(document.getElementById("num3").value);
            let n4 = parseFloat(document.getElementById("num4").value);
            let n5 = parseFloat(document.getElementById("num5").value);

            let largest = n1;

            // Using conditional statements
            if (n2 > largest) {
                largest = n2;
            }
            if (n3 > largest) {
                largest = n3;
            }
            if (n4 > largest) {
                largest = n4;
            }
            if (n5 > largest) {
                largest = n5;
            }

            alert("The largest number is: " + largest);
        }
    </script>
</head>

<body>

    <div class="container">
        <h2>Largest of Five Numbers</h2>

        <input type="number" id="num1" placeholder="Enter first number"><br>
        <input type="number" id="num2" placeholder="Enter second number"><br>
        <input type="number" id="num3" placeholder="Enter third number"><br>
        <input type="number" id="num4" placeholder="Enter fourth number"><br>
        <input type="number" id="num5" placeholder="Enter fifth number"><br>

        <button onclick="findLargest()">Find Largest</button>
    </div>

</body>
</html>
