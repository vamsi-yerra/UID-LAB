<!DOCTYPE html>
<html>
<head>
    <title>Sign of Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url(https://img-cdn.pixlr.com/pixlr-templates/64a26c58c4247e1cdde69e09/preview.webp);
            background-repeat: no-repeat;
            background-size:cover;
            text-align: center;
            margin-top: 80px;
        }

        .container {
            background: rgb(229, 124, 124);
            padding: 30px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #2980b9;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1c5980;
        }
    </style>

    <script>
        function findSign() {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);
            let num3 = parseFloat(document.getElementById("num3").value);

            let product = num1 * num2 * num3;

            if (product > 0) {
                alert("The sign of the product is + (Positive)");
            } else if (product < 0) {
                alert("The sign of the product is - (Negative)");
            } else {
                alert("The product is 0");
            }
        }
    </script>
</head>

<body>

    <div class="container">
        <h2>*..Find Product Sign..*</h2>

        <input type="number" id="num1" placeholder="Enter first number"><br>
        <input type="number" id="num2" placeholder="Enter second number"><br>
        <input type="number" id="num3" placeholder="Enter third number"><br>

        <button onclick="findSign()">Check Sign</button>
    </div>

</body>
</html>
