<!DOCTYPE html>
<html>
<head>
    <title>Signup Page</title>
    <style>
        
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-box { max-width: 300px; padding: 20px; border: 1px solid #ddd; }
        .error { color: red; font-size: 12px; display: none; }
        input { display: block; margin-bottom: 10px; width: 100%; padding: 5px; }
    </style>
</head>
<body style="background-color: rgb(169, 176, 176);">

    <div class="form-box">
        <h3>Create Account</h3>
        <form id="signup">
            <input type="text" id="user" placeholder="Name" required>
            
            <input type="email" id="mail" placeholder="Email Address">
            <p id="msg" class="error">That email doesn't look right.</p>
            
            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        const myForm = document.getElementById('signup');
        const mailInput = document.getElementById('mail');
        const errMsg = document.getElementById('msg');

        myForm.onsubmit = function(e) {
            
            if (!mailInput.checkValidity() || mailInput.value === "") {
                e.preventDefault(); 
                errMsg.style.display = "block"; 
                mailInput.style.border = "1px solid red";
            } else {
                errMsg.style.display = "none";
                alert("All good! Sending form...");
            }
        };
    </script>

</body>
</html>
